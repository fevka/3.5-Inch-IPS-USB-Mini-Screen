[workspace]
members = ["configure-app/src-tauri"]

[package]
name = "mini-system-monitor"
version = "0.1.0"
edition = "2021"
description = "Minimal system monitor for 3.5 inch Turing Smart Screen"

[lib]
name = "mini_system_monitor"
path = "src/lib.rs"

[[bin]]
name = "mini-system-monitor"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serialport = "4.3"
sysinfo = { version = "0.33", features = ["network"] }
image = "0.25"
ab_glyph = "0.2"
chrono = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
wmi = "0.18"
once_cell = "1.20"
ureq = { version = "2", features = ["json"] }
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

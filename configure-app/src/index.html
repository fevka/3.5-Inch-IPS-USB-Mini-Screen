<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mini System Monitor — Settings</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <nav id="tabs">
      <button class="tab-btn active" data-tab="general">General</button>
      <button class="tab-btn" data-tab="theme">Theme Editor</button>
      <div id="status-line" class="status"></div>
    </nav>

    <section id="tab-general" class="tab-panel active">
      <div class="general-grid">
        <div class="pane" id="general-preview-pane">
          <h2>Theme Preview</h2>
          <div class="preview-frame">
            <img id="general-preview-img" alt="theme preview" />
          </div>
        </div>

        <div class="general-settings">
          <div class="grid-2">
            <div class="card">
              <h2>Connection</h2>
              <div class="field">
                <label>COM Port</label>
                <div class="row">
                  <select id="com-port"></select>
                  <button class="btn ghost" id="refresh-ports" title="Refresh">⟳</button>
                </div>
              </div>
              <div class="field">
                <label>Theme</label>
                <select id="cfg-theme"></select>
              </div>
            </div>

            <div class="card">
              <h2>Network</h2>
              <div class="field">
                <label>Ethernet interface</label>
                <input list="iface-list" id="eth" placeholder="e.g. eth0" />
              </div>
              <div class="field">
                <label>Wi-Fi interface</label>
                <input list="iface-list" id="wlo" placeholder="e.g. wlan0" />
              </div>
              <datalist id="iface-list"></datalist>
              <div class="field">
                <label>Ping address</label>
                <input id="ping" placeholder="8.8.8.8" />
              </div>
            </div>

            <div class="card">
              <h2>Weather</h2>
              <div class="field">
                <label>Search city</label>
                <div class="row">
                  <input id="city-query" placeholder="e.g. Istanbul" />
                  <button class="btn ghost" id="city-search-btn">Search</button>
                </div>
                <div id="city-results" class="city-results"></div>
                <div id="city-selected" class="city-selected"></div>
              </div>
              <div class="field">
                <label>Latitude</label>
                <div class="num-input">
                  <input id="weather-lat" type="number" step="0.0001" />
                  <div class="num-btn">
                    <button data-target="weather-lat" data-dir="up">▲</button>
                    <button data-target="weather-lat" data-dir="dn">▼</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label>Longitude</label>
                <div class="num-input">
                  <input id="weather-lon" type="number" step="0.0001" />
                  <div class="num-btn">
                    <button data-target="weather-lon" data-dir="up">▲</button>
                    <button data-target="weather-lon" data-dir="dn">▼</button>
                  </div>
                </div>
              </div>
              <div class="field">
                <label>Units</label>
                <select id="weather-units">
                  <option value="metric">Metric (°C)</option>
                  <option value="imperial">Imperial (°F)</option>
                </select>
              </div>
            </div>

            <div class="card compact squeeze">
              <h2>Display</h2>
              <div class="field">
                <label class="checkbox"><input type="checkbox" id="display-reverse" /> Reverse orientation</label>
              </div>
              <div class="field" style="margin-bottom:5px">
                <label class="checkbox"><input type="checkbox" id="reset-on-startup" /> Reset display on startup</label>
              </div>
              <div class="field" style="margin-bottom:5px">
                <label class="checkbox"><input type="checkbox" id="show-console" /> Show debug console window</label>
              </div>
              <div class="field" style="margin-bottom:0">
                <span style="display:flex;align-items:center;gap:8px">
                  <span style="color:var(--text-faint);font-size:12px;min-width:5.5em">Brightness</span>
                  <input id="brightness" type="range" min="0" max="100" style="flex:1" />
                  <span id="brightness-val" style="min-width:2.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-size:12px">20</span>
                </span>
              </div>
            </div>

            <div class="card compact squeeze">
              <h2>Advanced</h2>
              <div class="field">
                <label class="checkbox"><input type="checkbox" id="run-on-startup" /> Run on Windows startup (as admin)</label>
              </div>
              <div class="field">
                <label>Startup delay <span style="color:var(--text-faint);font-size:11px">(recommended: 30s)</span></label>
                <div class="row">
                  <select id="startup-delay" style="flex:1">
                    <option value="0">None</option>
                    <option value="10">10 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="30" selected>30 seconds</option>
                    <option value="40">40 seconds</option>
                  </select>
                </div>
              </div>
              <div class="field" style="margin-bottom:0">
                <label>LibreHardwareMonitor folder</label>
                <div class="row">
                  <input id="lhm-path" placeholder="C:\LibreHardwareMonitor" />
                  <button class="btn ghost" id="browse-lhm">Browse</button>
                </div>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn primary" id="save-config">Save</button>
            <button class="btn" id="launch-monitor">Start Monitor</button>
            <button class="btn" id="stop-monitor">Stop Monitor</button>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-theme" class="tab-panel">
      <div class="theme-toolbar">
        <label>Theme:</label>
        <select id="theme-select"></select>
        <span class="spacer"></span>
        <span id="theme-status" class="status"></span>
        <button class="btn primary" id="save-theme">Save</button>
      </div>

      <div class="theme-grid">
        <div class="pane" id="visual-pane">
          <h2>Visual Editor</h2>
          <div id="element-list"></div>
        </div>

        <div class="pane" id="yaml-pane">
          <h2>YAML</h2>
          <textarea id="yaml-editor"></textarea>
        </div>

        <div class="pane" id="preview-pane">
          <h2>Live Preview <span class="hint">(click or drag elements)</span></h2>
          <div class="preview-frame">
            <div class="preview-stage" id="preview-stage">
              <img id="preview-img" alt="preview" />
              <div id="preview-overlay"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
